name: Lightweight Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            build_arches: x64,arm64
          - os: macos-latest
            platform: mac
            arch: arm64
            build_arches: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            build_arches: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: launcher/go.sum
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test
      - run: pnpm build
      - name: Build native browser launchers and installers
        run: node scripts/build-launcher.mjs --arch ${{ matrix.build_arches }} --package
      - name: Test native server boundaries
        working-directory: launcher
        run: go test ./...
      - name: Test real packaged launcher and editor
        run: node scripts/test-desktop.mjs
      - name: Verify automatic update, content recovery and rollback
        run: node scripts/test-updater.mjs
      - name: Verify Windows installation and Electron upgrade cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/update-*.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Sign automatic update packages
        env:
          QUSU_UPDATE_SIGNING_KEY: ${{ secrets.QUSU_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sign-update.mjs installers
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" installers/*.exe installers/*.dmg installers/*.zip installers/update-manifest.json installers/update-manifest.sig --clobber
          gh release edit "$RELEASE_TAG" --draft=false
